small_title: Хамтран зохион байгуулах
heading: IBCM27 ба GB34
text: |
  IBCM27 хурал нь дэлхийн бүх амьд организмын тухай мэдээллийг нээлттэй түгээдэг олон улсын сүлжээ болох
  [Биологийн олон янз байдлын мэдээллийн дэлхийн байгууллага (GBIF)](https://www.gbif.org)-ын
  Удирдах зөвлөлийн 34 дэх хурал буюу **GB34**-тэй хамт зохион байгуулагдана.

  Хоёр арга хэмжээг нэг долоо хоногт зохион байгуулснаар дэлхийн өнцөг булан бүрээс биологичид
  болон биологийн олон янз байдлын мэдээллийн мэргэжилтнүүд Улаанбаатарт цугларна.
link: ""
button: GBIF.org дахь GB34-ийн албан ёсны хуудас
cards:
- title: GB34 — GBIF-ийн Удирдах зөвлөл
  text: GBIF-ийн гишүүн орнуудын төлөөлөгчид, хорооны гишүүд болон GBIF-ийн Нарийн бичгийн дарга нарын газарт зориулагдсан. Бүртгэл GBIF-ээр дамжина.
- title: IBCM27 — Эрдэм шинжилгээний хурал
  text: Бүх судлаач, оюутан, мэргэжилтнүүдэд нээлттэй. Бүртгэл энэ вэбсайтаар.
- title: Хамтарсан арга хэмжээ
  text: Симпозиум, сургалт зэрэг хамтарсан арга хэмжээ — удахгүй зарлагдана.   # EDIT
