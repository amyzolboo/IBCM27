small_title: Хурлын тухай
heading: Дэлхийн биологичдыг Монголд урьж байна
text: |
  Олон улсын биологийн эрдэм шинжилгээний хурал (IBCM) нь Монгол болон дэлхийн олон орны
  эрдэмтэн, судлаач, оюутан, мэргэжилтнүүдийг нэгтгэн, судалгааны шинэ үр дүнгээ хуваалцах,
  салбар хоорондын хамтын ажиллагааг бэхжүүлэх, биологийн шинжлэх ухааны тулгамдсан болон
  шинээр гарч буй асуудлын шийдлийг эрэлхийлэх зорилготой.

  2025 оны 9-р сарын 18–19-нд Биологийн хүрээлэнгийн 60 жилийн ойд зориулан Улаанбаатар хотноо
  амжилттай болсон IBCM25 хурлын үргэлжлэл болох IBCM27 нь пленар илтгэл, үндсэн илтгэл,
  урилгат илтгэл, аман болон постер илтгэлүүдээс бүрдэнэ.
