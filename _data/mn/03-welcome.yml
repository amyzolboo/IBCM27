small_title: Мэндчилгээ
heading: Зохион байгуулагчдын мэндчилгээ
list:
- name: Гантулга Даваахүү, Ph.D                                       # EDIT
  position: ШУА-ийн Биологийн хүрээлэнгийн захирал        # EDIT
  photo: GD.png
  message: |
    Эрхэм хүндэт эрдэмтэн, судлаачид аа,

    ШУА-ийн Биологийн хүрээлэнгийн нэрийн өмнөөс Улаанбаатар хотноо болох Олон улсын биологийн
    эрдэм шинжилгээний хурал 2027-д та бүхнийг урьж байгаадаа таатай байна.

    Монгол болон дэлхийн өнцөг булан бүрээс ирэх судлаачдыг хүлээн авч, шинэ нээлт, судалгааны
    үр дүнгээ хуваалцан, биологийн шинжлэх ухааны салбарт урт хугацааны хамтын ажиллагааг
    бэхжүүлэхийг тэсэн ядан хүлээж байна.

    Улаанбаатар хотноо уулзъя.
