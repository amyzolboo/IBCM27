small_title: Held together with
heading: IBCM27 & GB34
text: |
  IBCM27 will take place together with **GB34**, the 34th meeting of the Governing Board of the
  [Global Biodiversity Information Facility (GBIF)](https://www.gbif.org), an international network
  that provides open access to data about all types of life on Earth.

  Hosting both events in the same week brings together biologists and biodiversity data experts
  from around the world in Ulaanbaatar.
