small_title: Welcome message
heading: Greetings from the organizers
list:
- name: Gantulga Davaakhuu, Ph.D                                   # EDIT
  position: Director, Institute of Biology, Mongolian Academy of Sciences   # EDIT
  photo: "assets/images/GD.png"
  message: |
    Dear colleagues and friends,

    On behalf of the Institute of Biology of the Mongolian Academy of Sciences, it is my great
    pleasure to invite you to the International Biological Conference in Mongolia 2027 in Ulaanbaatar.

    We look forward to welcoming researchers from Mongolia and around the world, to sharing new
    discoveries, and to building lasting collaborations in the biological sciences.

    I look forward to meeting you in Ulaanbaatar.
