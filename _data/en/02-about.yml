small_title: About the conference
heading: Bringing the world's biologists to Mongolia
text: |
  The International Biological Conference in Mongolia (IBCM) brings together scientists,
  researchers, students and practitioners from Mongolia and around the world to share new
  findings, build interdisciplinary collaborations and explore solutions to current and
  emerging challenges in the biological sciences.

  Following the successful IBCM25, held in Ulaanbaatar on 18–19 September 2025 to mark the
  60th anniversary of the Institute of Biology, IBCM27 continues the series with plenary
  lectures, keynote talks, invited talks, and oral and poster sessions.
